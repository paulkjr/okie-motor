name: OkieHome
options:
  bundleIdPrefix: com.okiedokie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  OkieHome:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
      - Shared
      - Resources
    entitlements:
      path: Config/OkieHome.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.okiedokie.home.shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Okie Home
        CFBundleURLTypes:
          - CFBundleURLName: com.okiedokie.home
            CFBundleURLSchemes: [okiehome]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Okie Home talks to Home Assistant on your home network.
        NSMicrophoneUsageDescription: Okie Home listens when you press the microphone in the search bar, to turn your words into a request.
        NSSpeechRecognitionUsageDescription: Okie Home turns what you say into text for the search bar and the assistant.
        OkieKeychainGroup: $(AppIdentifierPrefix)com.okiedokie.home.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okiedokie.home
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: OkieWidgets
        embed: true
      - target: OkieWatch
        embed: true
  OkieWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widgets
      - Shared
      - path: Resources/Fonts
    entitlements:
      path: Config/OkieWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.okiedokie.home.shared
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Okie Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        OkieKeychainGroup: $(AppIdentifierPrefix)com.okiedokie.home.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okiedokie.home.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  OkieWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - path: Shared/HAAuth.swift
      - path: Shared/HAClient.swift
      - path: Shared/HAEntity.swift
      - path: Shared/HASession.swift
      - path: Shared/JSONValue.swift
      - path: Shared/Keychain.swift
      - path: Shared/Thermostat.swift
      - path: Shared/DialLook.swift
      - path: Shared/WidgetSpec.swift
      - path: Shared/Theme.swift
      - path: Shared/OkieIcons.swift
      - path: Shared/OkieSVGIcons.swift
      - path: Shared/SVGPath.swift
      - path: Resources/Fonts
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Okie Home
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.okiedokie.home
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okiedokie.home.watchkitapp
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
schemes:
  OkieHome:
    build:
      targets:
        OkieHome: all
    run:
      config: Debug
