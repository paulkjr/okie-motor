:root{--acc:150,150,150;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;height:100%;overflow:hidden;color:#f6f5f7;font:500 16px "Okie Manrope",-apple-system,system-ui,sans-serif;background:#120e0b;}
body{background:radial-gradient(120% 70% at 85% 12%,#4d392b 0%,#271c15 48%,#120e0b 100%);}
button{font:inherit;color:inherit;cursor:pointer;}
.app{height:100%;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),10px) 0 max(env(safe-area-inset-bottom),12px);}
.top{padding:16px 26px 0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;}
.name{font-size:14px;font-weight:700;letter-spacing:2.4px;color:rgba(255,255,255,.7);}
.state{font-size:17px;font-weight:700;color:rgb(var(--acc));line-height:1.1;}
/* the menu: a round bubble with the icon of the open tab; a tap opens it into the row of five and a choice (or a tap elsewhere) closes it again */
.menu{position:relative;align-self:center;width:186px;height:36px;margin:4px 0 0;flex:none;}
.bubble{position:absolute;left:50%;top:1px;width:34px;height:34px;margin-left:-17px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:#fff;color:#1d1b19;box-shadow:0 3px 12px rgba(0,0,0,.35);transition:opacity .16s ease,transform .26s cubic-bezier(.2,.8,.2,1);}
.bubble svg{width:17px;height:17px;}
.tabs{position:absolute;left:0;right:0;top:-3px;height:42px;display:flex;justify-content:center;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;-webkit-clip-path:inset(4px 76px 4px 76px round 17px);clip-path:inset(4px 76px 4px 76px round 17px);transition:opacity .2s ease,clip-path .32s cubic-bezier(.2,.8,.2,1),-webkit-clip-path .32s cubic-bezier(.2,.8,.2,1);}
.menu.open .tabs{opacity:1;pointer-events:auto;-webkit-clip-path:inset(0 0 0 0 round 21px);clip-path:inset(0 0 0 0 round 21px);}
.menu.open .bubble{opacity:0;transform:scale(.55);pointer-events:none;}
.tabs button{width:34px;height:34px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:none;color:rgba(255,255,255,.78);flex:none;transition:background .2s ease,color .2s ease;}
.tabs button svg{width:17px;height:17px;}
.tabs button.on{background:#fff;color:#1d1b19;}
.panes{position:relative;flex:1;min-height:0;}
.pane{position:absolute;inset:0;display:none;}.pane.on{display:block;}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 22px 28px;display:flex;flex-direction:column;gap:12px;}
.stage{position:absolute;inset:0;}
#wheel{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;opacity:0;}
.zone{position:absolute;top:0;bottom:0;right:0;width:46%;touch-action:none;}
.left{position:absolute;left:26px;top:19%;width:60%;pointer-events:none;}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2.2px;color:rgba(255,255,255,.62);margin-bottom:10px;}
.num{font-family:"Okie Sora",-apple-system,sans-serif;font-size:min(31vw,17vh);font-weight:800;line-height:.92;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 36px rgba(var(--acc),.3);}
.now{margin-top:10px;font-family:"Okie Sora",-apple-system,sans-serif;font-size:14px;font-weight:600;color:rgba(255,255,255,.62);}
.num.buzz{animation:thBuzz .14s ease;}@keyframes thBuzz{0%{transform:translateX(0)}30%{transform:translateX(-2px)}60%{transform:translateX(2px)}100%{transform:translateX(0)}}
.pm{display:flex;gap:12px;margin-top:18px;pointer-events:auto;}
.pm button{width:53px;height:53px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:30px;font-weight:500;line-height:1;padding:0;}
.pm button:active{background:rgba(255,255,255,.22);}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:18px;align-items:flex-start;padding:0 26px;}
.sched{display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px 0;color:rgb(var(--acc));font-size:11px;font-weight:700;letter-spacing:-.015em;}.sched svg{width:21px;height:21px;flex:none;}.sched .chev{color:rgba(255,255,255,.65);margin-left:4px;display:grid;}.sched .chev svg{width:12px;height:12px;}
.modes{display:flex;gap:14px;}
.mode{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:rgba(255,255,255,.62);font-size:10px;font-weight:600;padding:0;}
.mode i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);}
.mode svg{width:20px;height:20px;}
.mode.on{color:#fff;}.mode.on i{background:rgb(var(--acc));border:2px solid rgba(var(--acc),.85);box-shadow:0 0 0 3px rgba(20,18,16,.5),0 0 0 5px rgba(var(--acc),.5);}
.power{align-self:center;position:relative;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:0;background:none;color:rgba(255,255,255,.9);font-size:12px;font-weight:700;touch-action:none;}
.power{gap:9px;}
/* the card's own hold-to-turn-off: a circle around the power icon fills in 3 seconds */
.ring{position:relative;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:rgb(var(--acc));flex:none;}
.pic{position:relative;z-index:1;display:grid;place-items:center;}.pic svg{width:12px;height:12px;}
.prog{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}.prog circle{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-dasharray:107px;stroke-dashoffset:107px;}
.off .num{opacity:.4;}.off .zone{pointer-events:none;}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:rgba(0,0,0,.65);font-size:14px;font-weight:600;display:none;z-index:9;}
@media (max-height:700px){.left{top:2%}.num{font-size:min(28vw,15vh)}.pm{margin-top:12px}.pm button{width:50px;height:50px}.bottom{gap:12px}}
/* the other tabs */
.lbl{font-size:12px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;}
.note{font-size:14px;color:rgba(255,255,255,.62);text-align:center;padding:18px 8px;}.note.warn{background:rgba(255,200,80,.14);color:#ffd98a;border-radius:16px;}
.seg{display:inline-flex;align-self:flex-start;padding:4px;gap:2px;border-radius:999px;background:rgba(255,255,255,.1);}
.seg button{border:0;border-radius:999px;padding:11px 20px;background:none;font-size:15px;font-weight:500;color:rgba(255,255,255,.85);}.seg button.on{background:#fff;color:#1d1b19;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{padding:14px;border-radius:18px;background:rgba(255,255,255,.08);}.stat b{display:block;font:600 24px "Okie Sora",sans-serif;}.stat span{display:block;margin-top:4px;font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;}
.timeline{display:flex;height:34px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.05);}.timeline i{display:block;height:100%;}
.kv{display:flex;flex-direction:column;gap:6px;}.kvr{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.07);font-size:14px;}
.kvr span{color:rgba(255,255,255,.55);text-transform:capitalize;}.kvr b{font-weight:600;text-align:right;word-break:break-word;}
.hours{display:flex;align-items:flex-end;gap:3px;height:92px;margin-bottom:22px;}.hr{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;}.hr i{display:block;width:100%;border-radius:4px 4px 0 0;background:#7de4ff;opacity:.85;}.hr span{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.55);}
