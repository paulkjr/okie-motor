<script>
  var q = new URLSearchParams(location.search); window.__lang = q.get('lang') || 'en'; if (q.get('bfshim') === '1') window.__okieBfShim = true;      // ?bfshim=1: take the Safari path (plain backdrop values) in any browser
  if (q.get('fresh') === '1') { try { localStorage.clear(); } catch (e) {} }   // your own settings stay between visits and versions; ?fresh=1 starts clean
  var card = document.getElementById('card');
  var m = makeMockHass(function (h) { card.hass = h; });
  window.mock = m;
  var plain = q.get('plain') === '1' ? { scale: 100, glass: { tint: 40, cardBlur: 0, cardTint: 10, cardStyle: 'light' }, bento: { w1layout: 'grid', swap: true } } : {};      // ?plain=1: the old defaults, so the smoke test measures the same geometry as ever
  card.setConfig(Object.assign({
    squircle: q.get('squircle') || 'none',
    start: q.get('start') || 'bento',
    zen: { enabled: q.get('zen') === '1' },
    language: q.get('lang') || 'en',
    splash: q.get('splash') || 'none',
    power_entity: 'sensor.house_power',
    videos: { enabled: true, path: '/okie-videos' },
    weather_entity: 'weather.home'
  }, plain));
  applyDemoParams(q, card, m);
  card.hass = m.hass;
  if (location.hostname === 'localhost' && q.get('fresh') !== '1') setTimeout(function () {     // dev only: lets the developer read the settings you saved here, to turn them into the shipped defaults
    try { var d = {}; Object.keys(localStorage).filter(function (k) { return k.indexOf('okie:') === 0; }).forEach(function (k) { d[k] = localStorage.getItem(k); }); fetch('http://localhost:4655/settings?ua=' + (/Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent) ? 'safari' : 'other'), { method: 'POST', mode: 'no-cors', body: JSON.stringify(d) }).catch(function () {}); } catch (e) {}
  }, 2500);
  if (location.hostname === 'localhost' && q.get('dbg') === '1') setTimeout(function () {     // dev only (?dbg=1): a small panel that says whether this browser blurs what is behind glass (so a missing blur can be told apart from a missing rule)
    try {
      var sr = card.shadowRoot, out = [];
      var sup = function (p, v) { try { return CSS.supports(p, v); } catch (e) { return 'err'; } };
      out.push('UA ' + (/Version\/([\d.]+).*Safari/.exec(navigator.userAgent) || ['', '?'])[1] + (/Chrome/.test(navigator.userAgent) ? ' chrome' : ' safari'));
      out.push('supports backdrop-filter: ' + sup('backdrop-filter', 'blur(5px)') + '  -webkit-: ' + sup('-webkit-backdrop-filter', 'blur(5px)'));
      out.push('reduced-transparency: ' + (matchMedia('(prefers-reduced-transparency: reduce)').matches) + '  hover: ' + matchMedia('(hover:hover)').matches + '  pointer fine: ' + matchMedia('(pointer:fine)').matches);
      var pick = function (sel) { var e = sr.querySelector(sel); if (!e) return sel + ': none'; var cs = getComputedStyle(e); return sel + ': bf=' + (cs.backdropFilter || cs.webkitBackdropFilter || '-').slice(0, 44) + ' wbf=' + (cs.webkitBackdropFilter || '-').slice(0, 30); };
      out.push(pick('.search-panel')); out.push(pick('.device-list-item')); out.push(pick('.rc')); out.push(pick('.device-card'));
      var host = getComputedStyle(card);
      out.push('shim: needs=' + (window.OkieMotor.polish && window.OkieMotor.polish.needsBfShim && window.OkieMotor.polish.needsBfShim()) + ' rules=' + (card._bfRules && card._bfRules.length) + ' css=' + (card._bfStyle ? card._bfStyle.textContent.length : '-') + ' stage=' + !!card._stage);
      try { var stg = card._stage; stg.style.setProperty('--okie-bfprobe', 'var(--glass-backdrop)'); out.push('probe=' + getComputedStyle(stg).getPropertyValue('--okie-bfprobe').slice(0, 70)); stg.style.removeProperty('--okie-bfprobe'); } catch (e) { out.push('probe err ' + e); }
      out.push('first: ' + ((card._bfStyle && card._bfStyle.textContent) || '').slice(0, 130).replace(/\n/g, ' '));
      out.push('--okie-card-bf=' + host.getPropertyValue('--okie-card-bf') + ' --glass-blur-amount=' + host.getPropertyValue('--glass-blur-amount'));
      var box = document.createElement('div'); box.id = 'blurdbg';
      box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;max-width:560px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.78);padding:8px 10px;border-radius:10px;white-space:pre-wrap;pointer-events:none;';
      box.textContent = out.join('\n');
      var tests = document.createElement('div'); tests.style.cssText = 'display:flex;gap:8px;margin-top:6px;';
      var mk = function (label, wrapStyle) {
        var w = document.createElement('div'); w.style.cssText = 'position:relative;width:120px;height:70px;background:repeating-linear-gradient(90deg,#fff 0 6px,#000 6px 12px);' + (wrapStyle || '');
        var b = document.createElement('div'); b.style.cssText = 'position:absolute;inset:14px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(255,255,255,.12);font:10px sans-serif;color:#fff;display:grid;place-items:center;';
        b.textContent = label; w.appendChild(b); return w;
      };
      tests.appendChild(mk('A plain')); tests.appendChild(mk('B zoom .71', 'zoom:.7138;')); tests.appendChild(mk('C zoom+round', 'zoom:.7138;overflow:hidden;border-radius:20px;'));
      box.appendChild(tests);
      // which spellings does this Safari accept? each box blurs the stripes only if its value is understood
      var tests2 = document.createElement('div'); tests2.style.cssText = 'display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;';
      var mk2 = function (label, valueCss) {
        var w = document.createElement('div'); w.style.cssText = 'position:relative;width:84px;height:54px;background:repeating-linear-gradient(90deg,#fff 0 6px,#000 6px 12px);';
        var b = document.createElement('div'); b.style.cssText = 'position:absolute;inset:10px 6px;background:rgba(255,255,255,.12);font:9px sans-serif;color:#fff;display:grid;place-items:center;' + valueCss;
        b.textContent = label; w.appendChild(b); return w;
      };
      tests2.appendChild(mk2('D var()', '--t:blur(8px);-webkit-backdrop-filter:var(--t);'));
      tests2.appendChild(mk2('E var,none', '--t:blur(8px);-webkit-backdrop-filter:var(--t,none);'));
      tests2.appendChild(mk2('F calc', '-webkit-backdrop-filter:blur(calc(8px + 0px));'));
      tests2.appendChild(mk2('G +sat', '-webkit-backdrop-filter:blur(8px) saturate(1.5);'));
      tests2.appendChild(mk2('H long', '-webkit-backdrop-filter:blur(8px) saturate(1.8) brightness(100%) contrast(100%) grayscale(0%);'));
      tests2.appendChild(mk2('I both', '-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);'));
      tests2.appendChild(mk2('J host var', '--okie-card-bf:' + getComputedStyle(card).getPropertyValue('--okie-card-bf') + ';-webkit-backdrop-filter:var(--okie-card-bf,none);'));
      tests2.appendChild(mk2('K glass', '--glass-backdrop:' + getComputedStyle(card).getPropertyValue('--glass-backdrop') + ';-webkit-backdrop-filter:var(--glass-backdrop);'));
      box.appendChild(tests2);
      var gb = getComputedStyle(card).getPropertyValue('--glass-backdrop'); var pre = document.createElement('div'); pre.textContent = '--glass-backdrop=' + gb.slice(0, 200); box.appendChild(pre); document.body.appendChild(box);
    } catch (e) { var b2 = document.createElement('div'); b2.textContent = 'dbg error ' + e; b2.style.cssText = 'position:fixed;left:8px;bottom:8px;color:#fff;background:#900;z-index:99999;font:11px monospace;'; document.body.appendChild(b2); }
  }, 3500);
  var hh = m.hass; hh.language = q.get('lang') || 'en'; hh.locale = { language: hh.language };
