<script>

<script>

<script>

</script>
<script>if (/[?&]bridge=1/.test(location.search)) window.__okieBridge = {};  // dev: acts like the Okie Home app (the page keeps where you were)</script>
<script src="../dist/okie-motor.js"></script>

<script>

  // dev: ?openapp=server opens one of the card's own screens a moment after the start (to look at it in a browser where the page cannot be clicked, like the iPad simulator)
  // dev: ?music=1 puts the Spotify player among the favorites, in the right column
  if (q.get('music')) setTimeout(function () { try { var f = (card._ctx.settings.get().favorites || []).slice(); if (f.indexOf('media_player.spotify_alex') < 0) f.push('media_player.spotify_alex'); card._ctx.settings.set({ favorites: f, bento: { rightCards: ['media_player.spotify_alex'], rightOrder: ['w:slider', 'media_player.spotify_alex', 'w:feeder'] }, cardStyle: q.get('music') === 'large' ? { 'media_player.spotify_alex': 'large' } : {} }); } catch (e) { /* not there */ } }, 1500);
  // dev: ?arrange=1 opens the arrangement (the pencil) a moment after the start
  if (q.get('arrange')) setTimeout(function () { try { var f = function (root) { var r = root.querySelector('.w1-edit'); if (r) return r; var a = root.querySelectorAll('*'); for (var i = 0; i < a.length; i++) if (a[i].shadowRoot) { var x = f(a[i].shadowRoot); if (x) return x; } return null; }; f(document).click(); } catch (e) { /* not there */ } }, 3200);
  if (q.get('openapp')) setTimeout(function () { try { card._openApp(q.get('openapp')); } catch (e) { /* not there */ } }, 1800);
  // dev: ?diag=1 prints what the card measures (zoom, the sizes of the big numbers ...) over the page, for a browser where the console is out of reach (the iPad simulator)
  if (q.get('diag')) {

        var sel = q.get('diag') !== '1' ? q.get('diag') : ''; if (sel) { var xe = deepq(document, sel)[0]; o.sel = xe && { font: cs(xe, 'font-size'), off: [xe.offsetWidth, xe.offsetHeight], parentOff: xe.parentElement && [xe.parentElement.offsetWidth, xe.parentElement.offsetHeight], fs: cs(xe, '--okie-fs'), minFs: cs(xe, '-webkit-text-size-adjust') }; }
