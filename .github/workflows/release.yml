name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python3 tools/build.py --no-hemma && python3 tools/make-demo.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/okie-motor.js
            dist/okie-install.py
            dist/okie-demo.html
